[project]
name = "verigate"
version = "0.1.0"
description = "Signed receipts for every AI agent payment. Built on Circle's Agent Stack."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "4K Inc"},
]
keywords = ["ai-agents", "circle", "usdc", "payments", "receipts", "compliance", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "cryptography>=43.0.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
verigate-mcp = "verigate.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0", "httpx>=0.27.0"]
gemini = ["google-genai>=1.0.0"]
dashboard = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "reportlab>=4.0.0",
    "google-genai>=1.0.0",
]
dev = ["pytest>=8.0.0"]
all = [
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/4KInc/circle-prize-submission"
Repository = "https://github.com/4KInc/circle-prize-submission"
Documentation = "https://github.com/4KInc/circle-prize-submission#readme"

# ── Tooling ──────────────────────────────────────────────────────────
# Lint + type-check are enforced in CI, but scoped to the security-critical
# core (the risk engine, sanctions screening, behavioral layer). Those are
# the modules whose correctness a reviewer must be able to trust; they are
# fully typed and clean. The rest of the app is checked for lint only.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["engine", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# The trusted core is type-checked strictly; app glue is not gated on mypy.
files = ["circle/sanctions.py", "circle/behavioral.py", "circle/risk_scorer.py"]
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["circle", "verigate", "app"]
omit = ["*/tests/*", "engine/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verigate", "circle", "engine/gateway"]

[tool.hatch.build.targets.wheel.sources]
"engine/gateway" = "gateway"
