[project]
name = "verigate-circle-prize"
version = "1.0.0"
description = "Verigate — Deterministic AI Agent Payment Authorization for Circle Agent Stack"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "PyJWT>=2.8.0",
    "PyYAML>=6.0.0",
    "google-genai>=1.0.0",
    "reportlab>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["circle", "app"]
